<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Maru</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #d8d8d8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 0;
        }

        .card {
            width: 500px;
            height: 750px;
            background-color: #f4f4f4;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            margin-bottom: 12px;
            border-radius: 8px;
            display: block;
        }

        .card h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            color: #222222;
            margin-top: 0;
            margin-bottom: 16px;
        }

        .card p {
            font-size: 22px;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .card a {
            text-decoration: none;
        }

        .card button {
            background-color: #222222;
            color: white;
            border: none;
            padding: 14px 22px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .card button:hover {
            background-color: #555555;
            transform: scale(1.03);
        }

        .card button:active {
            background-color: #111111;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="maru.jpg" alt="Close-up photo of Maru the cat">

        <h1>The Great Maru</h1>

        <p>
            The Great Maru is a lazy kitty who loves to sleep on the couch and stare at you judgingly.
        </p>

        <a href="https://www.aspca.org/pet-care/cat-care" target="_blank">
            <button>Learn About Cats</button>
        </a>
    </div>

</body>
</html>
